[project]
name = "musicgen2-0"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "miditok>=3.1.0",
    "numpy>=1.26.0",
    "sentencepiece>=0.2.0",
    "torch>=2.11.0,<2.12",
    "transformers>=5.23.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
